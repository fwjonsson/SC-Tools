name: Deploy

# Puts the web app on the server (Hetzner, Arm64) after the Tests of a change to main came out green (a red run deploys nothing: before, the two ran side by
# side), or by hand (Run workflow). It builds the server for linux-arm64 with .NET inside (nothing to install on the server), copies it there as the user
# "deploy" and runs sctools-install, which switches to it, restarts the service and puts the version before back when the new one does not answer.
# Nothing happens until the three secrets exist (see "Going live" in the README): DEPLOY_HOST (the server's IP), DEPLOY_KEY (the private key setup.sh
# made) and DEPLOY_KNOWN_HOSTS (the server's key, so nobody can pose as it).
# The Tests run on main for every change to the core, the web view, the server, the tests and the planner scenarios: everything the site is made of, and a
# little more (a change to the tests alone puts the same site on the server again, which does no harm). A change to this file alone: Run workflow.
# Only a push to main of this repository deploys: "branches: main" goes by the branch's name alone, and a pull request from somebody's fork of the repo
# from his own branch called main would match it, so his code would go on the server once its Tests were green (31 Oct 2026).
on:
  workflow_run:
    workflows:
      - Tests
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}   # the commit the tests passed on (by hand: the branch picked)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build the server for the Arm server
        run: |
          dotnet publish src/SCTools.Server -c Release -r linux-arm64 --self-contained true -p:InformationalVersion=release-$SHA -o publish
          rm -f publish/appsettings.Development.json
          tar -czf app.tgz -C publish .
          ls -la app.tgz

      - name: Is the server set up?
        if: env.DEPLOY_HOST == ''
        run: echo "::notice title=Not deployed::There are no DEPLOY_ secrets yet, so the build is not put on a server (see Going live in the README)."

      - name: Put it on the server
        if: env.DEPLOY_HOST != ''
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          scp -i ~/.ssh/deploy -o BatchMode=yes app.tgz "deploy@$DEPLOY_HOST:/opt/sctools/incoming/app.tgz"
          ssh -i ~/.ssh/deploy -o BatchMode=yes "deploy@$DEPLOY_HOST" sctools-install /opt/sctools/incoming/app.tgz
          echo "::notice title=Deployed::The web app of ${SHA::7} runs on the server."
