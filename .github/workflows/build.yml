name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and publish a single exe
        run: dotnet publish HaulingTracker.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Zip the exe
        shell: pwsh
        run: Compress-Archive -Path publish/HaulingTracker.exe -DestinationPath HaulingTracker.zip

      - name: Keep the exe of this run
        uses: actions/upload-artifact@v4
        with:
          name: HaulingTracker
          path: HaulingTracker.zip

      # On main the newest exe is also put on the Releases page under one fixed link
      - name: Update the "latest" release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes 2>$null
          gh release create latest HaulingTracker.zip --title "Latest build" --notes "Newest build of main. Unzip and run HaulingTracker.exe."
