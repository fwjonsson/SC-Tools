name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and publish a single exe
        run: dotnet publish src/HaulingTracker/HaulingTracker.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:InformationalVersion=release-${{ github.sha }} -o publish

      - name: Build and publish the SC Tools Tracker (the tracker on the gaming PCs)
        run: dotnet publish src/HaulingTracker.Sender/HaulingTracker.Sender.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:InformationalVersion=release-${{ github.sha }} -o publish-sender

      - name: Build and publish the API tool
        run: dotnet publish src/ScApiTool/ScApiTool.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish-api

      - name: Zip the exes
        shell: pwsh
        run: |
          Compress-Archive -Path publish/HaulingTracker.exe -DestinationPath HaulingTracker.zip
          Compress-Archive -Path publish-sender/SCToolsTracker.exe -DestinationPath SCToolsTracker.zip
          # the same tracker under its old name, for the trackers from before the new name: they update from this zip and then rename themselves
          New-Item -ItemType Directory -Force old-name | Out-Null
          Copy-Item publish-sender/SCToolsTracker.exe old-name/HaulingTrackerSender.exe
          Compress-Archive -Path old-name/HaulingTrackerSender.exe -DestinationPath HaulingTrackerSender.zip
          Compress-Archive -Path publish-api/ScApiTool.exe -DestinationPath ScApiTool.zip

      - name: Keep the exe of this run
        uses: actions/upload-artifact@v4
        with:
          name: HaulingTracker
          path: |
            HaulingTracker.zip
            SCToolsTracker.zip
            HaulingTrackerSender.zip
            ScApiTool.zip

      # On main the newest exe is also put on the Releases page under one fixed link
      - name: Update the "latest" release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Remove the old release, and any half-made draft left behind by an earlier run (a draft has no tag, so the updater cannot find it)
          gh release delete latest --cleanup-tag --yes 2>$null
          foreach ($id in (gh api "repos/${{ github.repository }}/releases" --paginate --jq '.[] | select(.draft) | .id')) {
            if ($id) { gh api -X DELETE "repos/${{ github.repository }}/releases/$id" 2>$null }
          }
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/latest" 2>$null
          # The release is made without its files first, so it is published at once (with files, gh makes a draft, uploads and publishes it at the end, and
          # GitHub has left that draft unpublished: a draft has no public tag, so the updater said it could not read the newest version). The files come after.
          gh release create latest --target ${{ github.sha }} --latest --title "Latest build" --notes "Newest build of main. Unzip and run HaulingTracker.exe. SCToolsTracker.zip is the SC Tools Tracker every player runs on his gaming PC: it sends the lines of his Game.log the tools read to sct.fwjonsson.dev (it needs a key from Frank; HaulingTrackerSender.zip is the same tracker under its old name, for trackers that update from before). ScApiTool.zip is the small tool that downloads data from the Star Citizen Wiki API. The program checks this release at startup to update itself. build: ${{ github.sha }}"
          gh release upload latest HaulingTracker.zip SCToolsTracker.zip HaulingTrackerSender.zip ScApiTool.zip --clobber
          # The program finds the release by its tag: check a few times that it is published, has the tag and the exe; publish it when it is a draft, and fail loudly if that does not help
          $ok = $false
          for ($i = 0; $i -lt 6; $i++) {
            Start-Sleep -Seconds 5
            $rel = gh api "repos/${{ github.repository }}/releases/tags/latest" 2>$null | ConvertFrom-Json
            if ($rel -and $rel.draft -eq $false -and ($rel.assets | Where-Object { $_.name -eq 'HaulingTracker.zip' })) { $ok = $true; break }
            $id = gh api "repos/${{ github.repository }}/releases" --jq '[.[] | select(.tag_name == "latest")][0].id'
            if ($id) { gh api -X PATCH "repos/${{ github.repository }}/releases/$id" -F draft=false | Out-Null }
          }
          if (-not $ok) { throw "The latest release is not published." }
          exit 0
