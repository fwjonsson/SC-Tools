name: Tests

# The tests of the core, the web view and the server's database, and the planner scenarios (printed in the log, and as a notice on the run). They run on Linux:
# nothing in them needs Windows. They run for a pull request and for a merge to main that changes what they test (not for the Windows programs, the README or
# the deploy scripts), and by hand. Deploy follows a green run of main (deploy.yml), so a change to deploy.yml runs them too.
on:
  push:
    branches:
      - main
    paths:
      - 'src/SCTools.Core/**'
      - 'src/SCTools.Web/**'
      - 'src/SCTools.Server/**'
      - 'tests/**'
      - 'tools/PlanTest/**'
      - '.github/workflows/tests.yml'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'src/SCTools.Core/**'
      - 'src/SCTools.Web/**'
      - 'src/SCTools.Server/**'
      - 'tests/**'
      - 'tools/PlanTest/**'
      - '.github/workflows/tests.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        id: dotnet
        with:
          dotnet-version: 10.0.x
      # The packages of the last run with the same project files and SDK; the restores fetch only what is missing
      - name: The NuGet packages of the last run
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ steps.dotnet.outputs.dotnet-version }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ steps.dotnet.outputs.dotnet-version }}-
            nuget-${{ runner.os }}-
      # This builds the server too (the test project references it); Deploy builds it for the Arm server
      - name: Run the tests
        shell: bash
        run: |
          set +e
          dotnet test tests/SCTools.Tests -c Release --logger "console;verbosity=normal" > test.txt 2>&1
          code=$?
          cat test.txt
          # the counts first, then only what failed (a notice is cut off after a few thousand characters)
          summary=$(grep -E "^\s*(Total tests|Passed|Failed|Skipped):" test.txt | tr -s ' ' | tr '\n' ' ')
          problems=$(grep -E "^\s*Failed |error|Assert\.|Expected|Actual|at SCTools" test.txt | grep -v "warning" | head -80)
          body=$(printf "%s\n%s" "$summary" "$problems" | tail -c 6000 | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=Test results::$body"
          exit $code
      - name: Plan the scenarios
        shell: bash
        run: |
          set +e
          dotnet run --project tools/PlanTest -c Release > out.txt 2>&1
          code=$?
          cat out.txt
          body=$(grep -v "^\s*$" out.txt | grep -v "warning" | tail -c 6000 | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=Planner output::$body"
          exit $code
